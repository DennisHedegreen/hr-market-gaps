# Article-only bridge calibration.
# At 500 sales/week, 99 DKK incl VAT, 18 DKK non-primary cost/sale and
# ~221.25 kg secondary output/week, the published break-even threshold is
# ~78.3 DKK/kg. The public article does not expose the full decomposition of
# whole-input landed cost + owner labour + support + other variable + fixed.
# This residual makes the bridge reproduce that published threshold exactly.
# Codex should replace it with the Public Data Pack's full ledger before this
# case is treated as parity-complete.
